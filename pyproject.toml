[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cite-chain"
version = "0.1.0"
description = "Walk scholarly citation graphs from DOI seeds"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
cite-chain = "cite_chain.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
